<div class="payment">
  <div class="payment__product">
    @for (card of toPaymentCards$ | async; track card.id) {
      <product-card [card]="card" [cardTypes]="cardTypes.PAYMENT"></product-card>
    }
  </div>
  <mat-chip-set
    ><mat-chip class="payment__total-amount"
      >Итого к оплате: {{ getTotalPrice() }}</mat-chip
    ></mat-chip-set
  >
</div>

<div class="form">
  <mat-stepper [linear]="true" #stepper>
    <mat-step label="Персональные данные" [stepControl]="personalDataForm">
      <personal-data [formGroup]="personalDataForm"></personal-data>
      <button matButton="tonal" matStepperNext [disabled]="personalDataForm.invalid" class="btn">
        Далее
      </button>
    </mat-step>

    <mat-step
      label="Данные для оплаты"
      [stepControl]="paymentDetailsForm"
      [editable]="personalDataForm.valid"
    >
      <payment-details [formGroup]="paymentDetailsForm"></payment-details>
      <div class="form__actions">
        <button matButton="tonal" matStepperPrevious class="form__back-btn">Назад</button>
        <button
          matButton="tonal"
          [disabled]="paymentDetailsForm.invalid"
          (click)="onSubmit()"
          class="form__submit-btn"
        >
          Подтвердить
        </button>
      </div>
    </mat-step>
  </mat-stepper>
</div>
