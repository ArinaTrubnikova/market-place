<div class="pagination">
  @if (totalPages > 1) {
    <button matButton="elevated" (click)="prevPage()" [disabled]="currentPage === 1">Prev</button>

    @for (page of pages; track page) {
      <button matButton="elevated" (click)="goToPage(page)" [class.active]="currentPage === page">
        {{ page }}
      </button>
    }

    <button matButton="elevated" (click)="nextPage()" [disabled]="currentPage === totalPages">
      Next
    </button>
  }
</div>
