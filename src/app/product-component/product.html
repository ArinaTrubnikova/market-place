<h1 class="bold">Список наших самых лучших товаров</h1>

<search-bar (searchChange)="onFiltered($event)"></search-bar>

<show-modal [(isVisible)]="isModalVisible" [selectedCard]="selectedCard"></show-modal>

<div class="product">
  @if (filteredCards.length) {
    @for (product of filteredCards; track product.id) {
      <product-card
        [card]="product"
        (isModalShow)="showModal($event)"
        [cardTypes]="cardTypes.PRODUCT"
      ></product-card>
    }
  } @else {
    <h3 class="product__not-found-text">Товар не найден, измените поиск</h3>
  }
</div>
